name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported Node LTS lines (22 maintenance, 24 active).
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Every test is fetch-mocked or tmpdir-based, so the suite runs hermetically:
      # no Telegram, no GitHub API, no model CLIs, no secrets needed.
      - run: npm test
      - run: npm audit --omit=dev
