name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 = the engines floor; 22 = what the launchd services actually run.
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Every test is fetch-mocked or tmpdir-based, so the suite runs hermetically — no
      # Paperclip API, no Telegram, no secrets needed.
      - run: npm test
