<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">How Hermes-relay works</title><desc id="desc">The operator uses Telegram to exchange questions and answers with the Hermes bot. The bot checks identity, TOTP and lockdown, dispatches Claude or Codex sessions in isolated Git worktrees, and relays ask_owner calls through a local MCP tool. It reads and updates the GitHub issue and ledger, opens a PR, and drives a finisher through conflict handling, an audit by the other engine, CI and SHA-bound merge approval.</desc><rect x="0" y="0" width="1600" height="800" rx="0" fill="#0E131B"/><text x="64" y="88" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#F8FAFC">How Hermes-relay works</text><text x="64" y="133" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#B7C2D4">Your phone carries decisions. GitHub issues carry the work.</text><rect x="64" y="216" width="350" height="222" rx="16" fill="#171E29" stroke="#465266" stroke-width="2"/><rect x="548" y="216" width="468" height="222" rx="16" fill="#171E29" stroke="#465266" stroke-width="2"/><rect x="1160" y="216" width="376" height="222" rx="16" fill="#171E29" stroke="#465266" stroke-width="2"/><text x="88" y="264" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Your phone</text><text x="88" y="309" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#FFB66E">Telegram</text><text x="88" y="358" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#B7C2D4">Questions + recommendations</text><text x="88" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B7C2D4">Buttons or text replies</text><text x="574" y="264" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Hermes bot</text><text x="574" y="309" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#FFB66E">Identity · TOTP · lockdown</text><text x="574" y="358" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B7C2D4">Routes decisions and dispatches work</text><text x="574" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B7C2D4">Runs on your local host</text><text x="1186" y="264" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Agent sessions</text><text x="1186" y="309" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#FFB66E">Claude / Codex</text><text x="1186" y="358" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B7C2D4">Isolated Git worktrees</text><text x="1186" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B7C2D4">Local ask_owner MCP tool</text><path d="M532 284H430m12 -8 -12 8 12 8" fill="none" stroke="#FFB66E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="265" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#B7C2D4" text-anchor="middle">questions</text><path d="M430 366H532m-12 -8 12 8-12 8" fill="none" stroke="#FFB66E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="403" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#B7C2D4" text-anchor="middle">answers</text><path d="M1144 284H1032m12 -8 -12 8 12 8" fill="none" stroke="#FFB66E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1088" y="265" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#B7C2D4" text-anchor="middle">ask_owner</text><path d="M1032 366H1144m-12 -8 12 8-12 8" fill="none" stroke="#FFB66E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1088" y="397" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#B7C2D4" text-anchor="middle">dispatch</text><text x="1088" y="421" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#B7C2D4" text-anchor="middle">+ answers</text><path d="M670 438V480H368V520m-8 -12 8 12 8-12" fill="none" stroke="#B7C2D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="385" y="474" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#B7C2D4">Read + update</text><path d="M894 438V480H1160V520m-8 -12 8 12 8-12" fill="none" stroke="#B7C2D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1000" y="474" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#B7C2D4">Bot opens PR</text><rect x="64" y="524" width="620" height="176" rx="16" fill="#171E29" stroke="#465266" stroke-width="2"/><text x="90" y="570" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">GitHub issue + ledger</text><text x="90" y="614" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B7C2D4">Labels track work; comments preserve context.</text><text x="90" y="656" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B7C2D4">Decisions, questions, handoffs and outcomes.</text><rect x="780" y="524" width="756" height="176" rx="16" fill="#171E29" stroke="#465266" stroke-width="2"/><text x="806" y="570" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">PR finisher</text><text x="806" y="616" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFB66E">Conflicts</text><text x="945" y="616" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFB66E">Other-engine audit</text><text x="1241" y="616" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFB66E">CI</text><text x="1332" y="616" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFB66E">Merge</text><path d="M912 608H932m-9 -6 9 6-9 6" fill="none" stroke="#B7C2D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1167 608H1223m-9 -6 9 6-9 6" fill="none" stroke="#B7C2D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1280 608H1313m-9 -6 9 6-9 6" fill="none" stroke="#B7C2D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="806" y="659" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B7C2D4">Merge approval is bound to the PR head SHA.</text><path d="M64 735H1536" fill="none" stroke="#465266" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="775" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#B7C2D4">Allowlisted repositories. Owner decisions return to the waiting agent session.</text></svg>